name: Build artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-22.04
            os: linux
          - target: linux-arm64
            runner: ubuntu-22.04-arm
            os: linux
          - target: macos-arm64
            runner: macos-14
            os: macos
          - target: macos-amd64
            runner: macos-15-intel
            os: macos
          - target: windows-amd64
            runner: windows-2022
            os: windows

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server-app/web/package-lock.json

      - name: Build Web UI
        working-directory: server-app/web
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server-app/internal/go.mod
          cache-dependency-path: server-app/internal/go.sum

      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libudev-dev

      - name: Configure Windows GCC
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build server on Unix
        if: matrix.os != 'windows'
        shell: bash
        working-directory: server-app/internal
        run: |
          version=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)
          commit=$(git rev-parse --short=8 HEAD)
          CGO_ENABLED=1 go build \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${commit}" \
            -o ../nas-panel-server .

      - name: Build server on Windows
        if: matrix.os == 'windows'
        shell: pwsh
        working-directory: server-app/internal
        run: |
          $version = git describe --tags --abbrev=0 2>$null
          if ($LASTEXITCODE -ne 0) { $version = "dev" }
          $commit = git rev-parse --short=8 HEAD
          $env:CGO_ENABLED = "1"
          go build -ldflags "-s -w -X main.version=$version -X main.commit=$commit" -o ../nas-panel-server.exe .

      - name: Package server on Unix
        if: matrix.os != 'windows'
        shell: bash
        run: |
          package="nas-panel-server-${{ matrix.target }}"
          mkdir -p "dist/${package}/web/dist"
          cp server-app/nas-panel-server "dist/${package}/"
          cp -R server-app/web/dist/. "dist/${package}/web/dist/"
          cp server-app/config.example.json server-app/README.md "dist/${package}/"
          if [ "${{ matrix.os }}" = "linux" ]; then
            mkdir -p "dist/${package}/deploy"
            cp server-app/deploy/nas-panel.service server-app/deploy/70-nas-panel.rules "dist/${package}/deploy/"
            cp server-app/deploy/install.sh server-app/deploy/uninstall.sh "dist/${package}/"
            chmod 0755 "dist/${package}/install.sh" "dist/${package}/uninstall.sh"
          fi
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"

      - name: Package server on Windows
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $package = "nas-panel-server-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$package/web/dist" | Out-Null
          Copy-Item server-app/nas-panel-server.exe "dist/$package/"
          Copy-Item server-app/web/dist/* "dist/$package/web/dist/" -Recurse
          Copy-Item server-app/config.example.json,server-app/README.md "dist/$package/"
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip"

      - name: Upload server package
        uses: actions/upload-artifact@v7
        with:
          name: nas-panel-server-${{ matrix.target }}
          path: dist/nas-panel-server-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 7
          archive: false

  firmware:
    runs-on: ubuntu-latest
    name: GD32 firmware build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install make cmake unzip

      - name: Download Toolchains
        run: |
          wget https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v15.2.1-1.1/xpack-arm-none-eabi-gcc-15.2.1-1.1-linux-x64.tar.gz
          tar zxvf xpack-arm-none-eabi-gcc-15.2.1-1.1-linux-x64.tar.gz
          echo "$(pwd)/xpack-arm-none-eabi-gcc-15.2.1-1.1/bin" >> $GITHUB_PATH

      - name: Build app
        run: |
          cmake -S gd32-app -B gd32-app/build-ci -DCMAKE_BUILD_TYPE=Release
          cmake --build gd32-app/build-ci --config Release --parallel

      - name: Build bootloader
        run: |
          cmake -S gd32-bootloader -B gd32-bootloader/build-ci -DCMAKE_BUILD_TYPE=Release
          cmake --build gd32-bootloader/build-ci --config Release --parallel

      - name: Package firmware
        shell: bash
        run: |
          mkdir -p "dist/app"
          mkdir -p "dist/bootloader"
          cp gd32-app/build-ci/nas-panel.bin "dist/app"
          cp gd32-app/build-ci/nas-panel.hex "dist/app"
          cp gd32-app/build-ci/nas-panel.elf "dist/app"
          cp gd32-app/build-ci/nas-panel.map "dist/app"
          cp gd32-app/build-ci/nas-panel.lst "dist/app"
          cp gd32-bootloader/build-ci/nas-panel-bootloader.bin "dist/bootloader"
          cp gd32-bootloader/build-ci/nas-panel-bootloader.hex "dist/bootloader"
          cp gd32-bootloader/build-ci/nas-panel-bootloader.elf "dist/bootloader"
          cp gd32-bootloader/build-ci/nas-panel-bootloader.map "dist/bootloader"
          cp gd32-bootloader/build-ci/nas-panel-bootloader.lst "dist/bootloader"
          zip -r firmware.zip dist/

      - name: Upload firmware package
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: firmware.zip
          if-no-files-found: error
          retention-days: 7
          archive: false

  release:
    name: Prepare Release draft
    needs: [server, firmware]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
          skip-decompress: true

      - name: Create or update Release draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assets=(
            release-assets/firmware.zip
            release-assets/nas-panel-server-linux-amd64.tar.gz
            release-assets/nas-panel-server-linux-arm64.tar.gz
            release-assets/nas-panel-server-macos-amd64.tar.gz
            release-assets/nas-panel-server-macos-arm64.tar.gz
            release-assets/nas-panel-server-windows-amd64.zip
          )
          for asset in "${assets[@]}"; do
            test -s "$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done

          # 重跑时只更新草稿附件，保留手工编写的说明，不覆盖已发布版本。
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [ "$draft" != "true" ]; then
              echo "Release $RELEASE_TAG is already published; refusing to replace assets." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
